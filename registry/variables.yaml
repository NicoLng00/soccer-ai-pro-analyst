  - {code: team.elo, level: macro, entity_kind: team, kind: derived, dtype: num, unit: punti_elo, temporal_kind: state, knowable_rule: post_match, backfill_policy: allowed, feasibility: collectable, sources: [derived], description: "Elo calcolato da noi sui risultati sul campo"}
  - {code: team.attack_xg_strength, level: macro, entity_kind: team, kind: model, dtype: num, unit: xg_per_partita, temporal_kind: state, knowable_rule: post_match, backfill_policy: allowed, feasibility: collectable, sources: [understat, derived], description: "Forza offensiva da xG, pesata nel tempo"}
  - {code: team.defense_xg_strength, level: macro, entity_kind: team, kind: model, dtype: num, unit: xg_per_partita, temporal_kind: state, knowable_rule: post_match, backfill_policy: allowed, feasibility: collectable, sources: [understat, derived], description: "Forza difensiva da xG concessi, pesata nel tempo"}
