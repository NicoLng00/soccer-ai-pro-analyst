  - {code: team.form_xgd_last5, level: macro, entity_kind: team, kind: derived, dtype: num, unit: xg, temporal_kind: state, knowable_rule: post_match, backfill_policy: allowed, feasibility: collectable, sources: [understat, derived], description: "Differenza xG nelle ultime 5 partite"}
  - {code: team.ppg_home, level: macro, entity_kind: team, kind: derived, dtype: num, unit: punti_per_partita, temporal_kind: state, knowable_rule: post_match, backfill_policy: allowed, feasibility: collectable, sources: [derived], description: "Punti per partita in casa nella stagione"}
