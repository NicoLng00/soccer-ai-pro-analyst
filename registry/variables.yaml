# Registro delle variabili. Caricato in obs.variable da `sap registry sync`.
# Ogni variabile nasce `experimental` e diventa `active` solo se migliora la calibrazione
# su partite mai viste in addestramento (vedi docs/variables.md).
#
# Campi: code, level, entity_kind, kind, dtype, unit, temporal_kind, knowable_rule,
#        backfill_policy, feasibility, sources, description
# I fatti strutturati (risultati, formazioni, trasferimenti, mandati, quote) vivono in
# ref.* e mkt.*: qui compaiono solo le variabili che ne derivano.

version: 1

defaults:
  status: experimental
  version: 1
  unit: adimensionale

variables:
  # ---------------------------------------------------------------- MACRO
  - {code: match_team.standing_points_before, level: macro, entity_kind: match_team, kind: derived, dtype: num, unit: punti, temporal_kind: attribute, knowable_rule: pre_match, backfill_policy: allowed, feasibility: collectable, sources: [derived], description: "Punti in classifica prima della partita, da risultati omologati e penalizzazioni"}
  - {code: match_team.standing_position_before, level: macro, entity_kind: match_team, kind: derived, dtype: num, unit: posizione, temporal_kind: attribute, knowable_rule: pre_match, backfill_policy: allowed, feasibility: collectable, sources: [derived], description: "Posizione in classifica prima della partita"}
  - {code: match_team.goal_diff_before, level: macro, entity_kind: match_team, kind: derived, dtype: num, unit: gol, temporal_kind: attribute, knowable_rule: pre_match, backfill_policy: allowed, feasibility: collectable, sources: [derived], description: "Differenza reti prima della partita"}
  - {code: match_team.objective, level: macro, entity_kind: match_team, kind: derived, dtype: cat, temporal_kind: attribute, knowable_rule: pre_match, backfill_policy: allowed, feasibility: collectable, sources: [derived], description: "Obiettivo ancora in gioco: title, europe, relegation, none"}
