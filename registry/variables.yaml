  - {code: team.club_instability_12m, level: macro, entity_kind: team, kind: derived, dtype: num, unit: cambi, temporal_kind: state, knowable_rule: announcement, backfill_policy: allowed, feasibility: approximable, sources: [derived], description: "Cambi di allenatore negli ultimi 12 mesi; DS senza fonte strutturata"}
  - {code: team.press_sentiment, level: macro, entity_kind: team, kind: model, dtype: num, temporal_kind: state, knowable_rule: publication, backfill_policy: excluded, feasibility: to_test, sources: [news_rss, agent_news], description: "Sentiment medio della stampa sulla squadra, da -1 a 1, ultimi 7 giorni"}
