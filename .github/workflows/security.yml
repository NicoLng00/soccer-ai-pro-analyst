name: sicurezza

# Catena di fornitura (docs/security.md): segreti nel codice e dipendenze vulnerabili.
# Gira su ogni PR, su main e ogni settimana, perché una vulnerabilità nuova può
# comparire in una dipendenza che non è cambiata.
# Le azioni sono fissate a SHA (con la versione in commento); Dependabot le aggiorna.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

concurrency:
  group: security-${{ github.ref }}
  # Solo le PR si annullano a vicenda: un push su main non interrompe la scansione settimanale.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  UV_VERSION: "0.12.18"

jobs:
  secrets:
    name: segreti nella storia (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: 8.30.1
      # Dal file gitleaks_8.30.1_checksums.txt della release ufficiale.
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: nessun file .env tracciato
        run: |
          if git ls-files | grep -E '(^|/)\.env($|\.|rc$)'; then
            echo "File .env tracciati: vanno tolti dal repository (il modello è env.example)." >&2
            exit 1
          fi
      - name: installa gitleaks con verifica del checksum
        run: |
          curl -sSfL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum --check --strict -
          tar -xzf gitleaks.tar.gz gitleaks
      - name: scansione di tutta la storia
        run: ./gitleaks git --redact --no-banner --exit-code 1 .

  dependencies:
    name: dipendenze vulnerabili (pip-audit, ${{ matrix.os }})
    # Due sistemi: pip-audit salta i pacchetti il cui marker non vale sulla piattaforma,
    # e lo sviluppo avviene anche su Windows (pywin32, colorama, ...).
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          version: ${{ env.UV_VERSION }}
      - name: esporta il lockfile con gli hash, tutti gli extra e i gruppi
        run: >-
          uv export --locked --all-extras --all-groups --no-emit-project
          --format requirements.txt -o requirements-audit.txt
      - name: pip-audit
        # Un'eccezione si dichiara con --ignore-vuln <ID> e un commento con il motivo e la scadenza.
        run: >-
          uvx pip-audit==2.10.1 --strict --disable-pip --require-hashes
          --progress-spinner off -r requirements-audit.txt
