name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Azioni fissate a SHA con la versione in commento (Dependabot le aggiorna); uv a versione fissa.
env:
  UV_VERSION: "0.12.18"

jobs:
  check:
    name: lint, tipi, test veloci
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy src
      - run: uv run sap registry validate
      - run: uv run pytest -m "not integration and not slow" --cov=soccer_analyst --cov-report=term

  integration:
    name: migrazioni da zero e test con Postgres
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: check
    services:
      postgres:
        # Stessa versione di docker-compose.yml (e quindi dei testcontainers).
        image: postgres:18.6
        env:
          POSTGRES_PASSWORD: ci-admin
          POSTGRES_DB: sap
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d sap"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      SAP_ENV: ci
      SAP_DB_URL_ADMIN: postgresql://postgres:ci-admin@localhost:5432/sap
      SAP_DB_URL_OWNER: postgresql://sap_owner:ci-owner@localhost:5432/sap
      SAP_DB_URL_LIVE: postgresql://sap_live:ci-live@localhost:5432/sap
      SAP_DB_URL_BACKFILL: postgresql://sap_backfill:ci-backfill@localhost:5432/sap
      SAP_DB_URL_REGISTRY: postgresql://sap_registry:ci-registry@localhost:5432/sap
      SAP_DB_URL_READONLY: postgresql://sap_readonly:ci-readonly@localhost:5432/sap
      SAP_DB_URL_API: postgresql://sap_api:ci-api@localhost:5432/sap
      SAP_DB_URL_USERADMIN: postgresql://sap_useradmin:ci-useradmin@localhost:5432/sap
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv sync --locked
      - run: uv run python scripts/provision_roles.py
      - name: migrazioni da zero
        if: hashFiles('migrations/env.py') != ''
        run: uv run alembic upgrade head
      - name: migrazioni reversibili solo in CI (downgrade e upgrade su database vuoto)
        if: hashFiles('migrations/env.py') != ''
        run: uv run alembic downgrade base && uv run alembic upgrade head
      - name: test di integrazione (testcontainers)
        run: uv run pytest -m integration
