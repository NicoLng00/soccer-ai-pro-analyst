# Aggiornamenti delle dipendenze (docs/security.md, catena di fornitura).
# Il frontend (npm in /frontend) si aggiunge qui nella fase 6, quando esiste.
version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "Aggiorna"
    groups:
      dipendenze-minori:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "Aggiorna"

  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: "Aggiorna"
