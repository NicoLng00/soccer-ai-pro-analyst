# Aggiornamenti delle dipendenze (docs/security.md, catena di fornitura).
# Il frontend (npm in /frontend) si aggiunge qui nella fase 6, quando esiste.
# cooldown: una release resta in attesa qualche giorno prima di essere proposta, così una
# versione compromessa ha il tempo di essere ritirata (gli aggiornamenti di sicurezza no).
version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    commit-message:
      prefix: "Aggiorna"
    groups:
      dipendenze-minori:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    commit-message:
      prefix: "Aggiorna"

  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    commit-message:
      prefix: "Aggiorna"
